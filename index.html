<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Opening in Claude</title>
<style>
  :root { color-scheme: light dark; --bg: #F2F3F6; --ink: #161920; --muted: #5A606E; --accent: #9C5A0C; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0F1116; --ink: #E7E9EE; --muted: #9AA0AD; --accent: #E2A24B; } }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--ink);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
  p { margin: 0; color: var(--muted); text-align: center; }
  a { color: var(--accent); }
</style>
</head>
<body>
<p id="msg">Opening in Claude…</p>
<script>
/* Bounce page for BadaLedger's chat buttons: the Claude desktop app won't open claude:// links from inside a page,
   but it opens them from the browser. This page reads ONLY the part of its address after "#", which browsers never
   send to the server: #chat/<uuid> or #project/<uuid>. Anything else is refused. It holds no data and loads nothing. */
(function () {
  "use strict";
  var msg = document.getElementById("msg");
  var m = /^#(chat|project)\/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$/i.exec(location.hash || "");
  if (!m) { msg.textContent = "Invalid link"; return; }
  var path = m[1].toLowerCase() + "/" + m[2].toLowerCase();
  var web = "https://claude.ai/" + path;
  var ua = navigator.userAgent || "";
  var phone = /Android|iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  msg.textContent = "Opening in Claude… ";
  var a = document.createElement("a"); a.href = web; a.rel = "noopener noreferrer"; a.textContent = "open in browser instead";
  msg.appendChild(a);
  location.href = phone ? web : "claude://claude.ai/" + path;
  setTimeout(function () { try { window.close(); } catch (e) {} }, 2000);
})();
</script>
</body>
</html>
